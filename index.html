<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">海外代購選物所</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="bg-indigo-600 text-white p-2 rounded-xl text-xl shadow-md"><i class="fa-solid fa-plane-departure"></i></span>
                <h1 id="brand-title" class="text-xl font-black tracking-wider text-gray-900">海外代購選物所</h1>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="openBuyerOrdersModal()" id="my-orders-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-xl font-medium transition text-xs sm:text-sm flex items-center space-x-1.5 cursor-pointer">
                    <i class="fa-solid fa-receipt text-indigo-600"></i>
                    <span class="hidden sm:inline">我的訂單查詢</span>
                </button>

                <button onclick="openCartModal()" id="cart-btn" class="relative bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-4 py-2 rounded-xl font-medium transition flex items-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="hidden sm:inline">購物車</span>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shadow">0</span>
                </button>

                <button onclick="handleAdminToggle()" id="mode-toggle-btn" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-xl font-medium transition flex items-center space-x-2 shadow-sm cursor-pointer">
                    <i id="mode-icon" class="fa-solid fa-lock"></i>
                    <span id="mode-text">賣家後台</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- 買家前台介面 -->
        <div id="buyer-view" class="space-y-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 justify-between items-center">
                <div id="category-filter-container" class="flex flex-wrap gap-2 w-full md:w-auto"></div>
                <div class="relative w-full md:w-72">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fa-solid fa-search"></i></span>
                    <input type="text" id="search-input" oninput="renderBuyerProducts()" placeholder="搜尋商品名稱..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>
            <div id="buyer-product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </div>

        <!-- 賣家後台介面 -->
        <div id="admin-view" class="hidden space-y-6">
            <div class="flex border-b border-gray-200 overflow-x-auto justify-between items-center bg-white px-4 rounded-2xl shadow-sm">
                <div class="flex">
                    <button onclick="switchAdminTab('products')" id="tab-btn-products" class="px-6 py-3 font-bold text-indigo-600 border-b-2 border-indigo-600 whitespace-nowrap cursor-pointer"><i class="fa-solid fa-box-open mr-2"></i>商品管理</button>
                    <button onclick="switchAdminTab('orders')" id="tab-btn-orders" class="px-6 py-3 font-medium text-gray-500 hover:text-gray-800 whitespace-nowrap cursor-pointer"><i class="fa-solid fa-file-invoice-dollar mr-2"></i>訂單管理</button>
                    <button onclick="switchAdminTab('settings')" id="tab-btn-settings" class="px-6 py-3 font-medium text-gray-500 hover:text-gray-800 whitespace-nowrap cursor-pointer"><i class="fa-solid fa-gear mr-2"></i>系統設定</button>
                </div>
                <button onclick="adminLogout()" class="text-xs text-rose-600 hover:underline font-bold px-3 py-1 cursor-pointer"><i class="fa-solid fa-right-from-bracket mr-1"></i>登出後台</button>
            </div>

            <!-- 商品管理 -->
            <div id="admin-tab-products" class="space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h3 id="form-title" class="text-lg font-bold text-gray-900 mb-4 flex items-center">
                        <i class="fa-solid fa-circle-plus text-indigo-600 mr-2"></i>上架新商品 (手機拍照自動壓縮)
                    </h3>
                    <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4">
                        <input type="hidden" id="edit-product-id">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div><label class="block text-xs font-bold text-gray-600 mb-1">商品名稱 *</label><input type="text" id="p-name" required class="w-full px-3 py-2 border rounded-xl text-sm"></div>
                            <div><label class="block text-xs font-bold text-gray-600 mb-1">國家/分類 *</label><select id="p-country" required class="w-full px-3 py-2 border rounded-xl text-sm bg-white"></select></div>
                            <div><label class="block text-xs font-bold text-gray-600 mb-1">台幣售價 (NT$) *</label><input type="number" id="p-price" required min="0" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-xs font-bold text-gray-600 mb-1">庫存數量 *</label><input type="number" id="p-stock" required min="0" value="10" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
                            <div><label class="block text-xs font-bold text-gray-600 mb-1">登記截止日期 (選填)</label><input type="date" id="p-deadline" class="w-full px-3 py-2 border rounded-xl text-sm bg-white"></div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">選擇商品照片 (最多 5 張) *</label>
                            <input type="file" id="p-image-files" accept="image/*" multiple onchange="handleMultipleImages(event)" class="block w-full text-xs text-gray-500 border rounded-xl p-1 cursor-pointer">
                            <p class="text-[11px] text-gray-400 mt-1">已選 <span id="img-count-badge" class="font-bold text-indigo-600">0</span> 張</p>
                        </div>
                        <div id="multi-img-preview-container" class="flex flex-wrap gap-3"></div>
                        <div><label class="block text-xs font-bold text-gray-600 mb-1">商品描述</label><textarea id="p-desc" rows="2" class="w-full px-3 py-2 border rounded-xl text-sm"></textarea></div>
                        <div class="flex items-center space-x-2 pt-2">
                            <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow cursor-pointer">儲存並上架</button>
                            <button type="button" onclick="resetProductForm()" id="cancel-edit-btn" class="hidden bg-gray-200 text-gray-700 font-bold py-2.5 px-4 rounded-xl text-sm cursor-pointer">取消編輯</button>
                        </div>
                    </form>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b"><h4 class="font-bold text-gray-800">現有商品列表 (<span id="product-count">0</span>)</h4></div>
                    <div class="overflow-x-auto"><table class="w-full text-left border-collapse"><tbody id="admin-product-table" class="divide-y divide-gray-100 text-sm"></tbody></table></div>
                </div>
            </div>

            <!-- 訂單管理 -->
            <div id="admin-tab-orders" class="hidden space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b flex justify-between items-center">
                        <h4 class="font-bold text-gray-800">買家訂單紀錄 (<span id="order-count">0</span>)</h4>
                        <button onclick="fetchCloudOrders()" class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl text-xs font-bold"><i class="fa-solid fa-rotate mr-1"></i>同步雲端訂單</button>
                    </div>
                    <div class="overflow-x-auto"><table class="w-full text-left border-collapse"><tbody id="admin-order-table" class="divide-y divide-gray-100 text-sm"></tbody></table></div>
                </div>
            </div>

            <!-- 系統設定 -->
            <div id="admin-tab-settings" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4 max-w-xl">
                    <h4 class="font-bold text-gray-800 text-lg border-b pb-2">基本設定</h4>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">網站名稱</label><input type="text" id="setting-brand" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">後台密碼</label><input type="password" id="setting-admin-pwd" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">GAS 網址 (sheetsUrl)</label><input type="url" id="setting-sheets-url" class="w-full px-3 py-2 border rounded-xl text-sm"></div>
                    <button onclick="saveBasicSettings()" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-xl text-sm cursor-pointer">儲存設定</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 彈窗群組省略 (維持原本購物車、訂單成功與查詢結構) -->
    <div id="order-success-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 text-center space-y-5">
            <h3 class="font-black text-xl text-gray-900">訂單建立成功！</h3>
            <p class="text-sm text-gray-500">訂單編號：<span id="success-order-id" class="font-bold text-indigo-600"></span></p>
            <button onclick="loginWithLineAfterOrder()" class="w-full bg-[#06C755] text-white py-2.5 px-4 rounded-xl font-bold">連結 LINE 帳號 (接收通知)</button>
            <button onclick="closeOrderSuccessModal()" class="w-full bg-gray-900 text-white py-3 rounded-xl">完成</button>
        </div>
    </div>

    <script>
        const LOGIN_CHANNEL_ID = '2012296940';
        let currentCreatedOrderId = null; 

        let settings = JSON.parse(localStorage.getItem('daigou_settings')) || {
            brand: "海外代購選物所", adminPwd: "1234", sheetsUrl: "", countries: ["日本代購 🇯🇵", "韓國代購 🇰🇷"]
        };
        let products = JSON.parse(localStorage.getItem('daigou_products')) || [];
        let orders = JSON.parse(localStorage.getItem('daigou_orders')) || [];
        let cart = JSON.parse(localStorage.getItem('daigou_cart')) || [];
        let isAdminLoggedIn = false, currentCategory = '全部', currentUploadedImages = [];

        window.addEventListener('DOMContentLoaded', async () => {
            // 偵測 LINE 綁定回傳參數
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('lineBind') === 'success') {
                alert('LINE 帳號已成功綁定此筆訂單！');
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            await fetchCloudSettings();
            await fetchCloudProducts();
            await fetchCloudOrders();
            applySettings();
            renderBuyerProducts();
            renderCategoryFilters();
        });

        async function fetchCloudSettings() {
            if (settings.sheetsUrl) {
                try {
                    let res = await fetch(`${settings.sheetsUrl}?action=getSettings`);
                    let cloudData = await res.json();
                    if (cloudData && cloudData.brand) { settings = cloudData; localStorage.setItem('daigou_settings', JSON.stringify(settings)); }
                } catch(e) {}
            }
        }

        async function fetchCloudProducts() {
            if (settings.sheetsUrl) {
                try {
                    let res = await fetch(`${settings.sheetsUrl}?action=getProducts`);
                    let cloudProducts = await res.json();
                    if (Array.isArray(cloudProducts)) { products = cloudProducts; localStorage.setItem('daigou_products', JSON.stringify(products)); }
                } catch(e) {}
            }
        }

        async function fetchCloudOrders() {
            if (settings.sheetsUrl) {
                try {
                    let res = await fetch(`${settings.sheetsUrl}?action=getOrders`);
                    let cloudOrders = await res.json();
                    if (Array.isArray(cloudOrders)) { orders = cloudOrders; localStorage.setItem('daigou_orders', JSON.stringify(orders)); renderAdminOrders(); }
                } catch(e) {}
            }
        }

        async function syncProductsToCloud() {
            if (settings.sheetsUrl && products.length > 0) {
                try {
                    await fetch(settings.sheetsUrl, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'saveProducts', products: products })
                    });
                } catch(e) {}
            }
        }

        // 🖼️ 手機照片自動縮圖壓縮 (解決上傳過大崩潰問題)
        function handleMultipleImages(e) {
            const files = Array.from(e.target.files);
            if (currentUploadedImages.length + files.length > 5) { alert('最多 5 張照片！'); return; }

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        const maxSize = 800; // 限制最大寬高 800px

                        if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
                        else if (height > maxSize) { width *= maxSize / height; height = maxSize; }

                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        currentUploadedImages.push(canvas.toDataURL('image/jpeg', 0.7)); // 壓縮品質 70%
                        renderImagePreviews();
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function renderImagePreviews() {
            const container = document.getElementById('multi-img-preview-container');
            document.getElementById('img-count-badge').innerText = currentUploadedImages.length;
            container.innerHTML = currentUploadedImages.map((src, idx) => `
                <div class="relative w-20 h-20 rounded-xl overflow-hidden border">
                    <img src="${src}" class="w-full h-full object-cover">
                    <button type="button" onclick="currentUploadedImages.splice(${idx},1); renderImagePreviews();" class="absolute top-1 right-1 bg-rose-600 text-white w-5 h-5 rounded-full text-xs">×</button>
                </div>
            `).join('');
        }

        function renderBuyerProducts() {
            const grid = document.getElementById('buyer-product-grid');
            grid.innerHTML = products.map((p, idx) => `
                <div class="bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col">
                    <!-- 比例固定正方形外框 -->
                    <div class="relative aspect-square overflow-hidden bg-gray-100">
                        <img src="${p.images[0] || ''}" class="w-full h-full object-cover">
                        <span class="absolute top-3 left-3 bg-black/60 text-white text-[10px] px-2 py-1 rounded-full">${p.country}</span>
                    </div>
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <h4 class="font-bold text-sm line-clamp-1">${p.name}</h4>
                        <div class="flex justify-between items-center mt-3 pt-2 border-t">
                            <span class="font-black text-indigo-600">NT$ ${p.price}</span>
                            <button onclick="addToCartByIndex(${idx}, 1)" class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl text-xs font-bold">加購</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function loginWithLineAfterOrder() {
            if (!settings.sheetsUrl) return;
            const stateData = { url: window.location.href, orderId: currentCreatedOrderId };
            window.open(`https://access.line.me/oauth2/v2.1/authorize?response_type=code&client_id=${LOGIN_CHANNEL_ID}&redirect_uri=${encodeURIComponent(settings.sheetsUrl)}&state=${encodeURIComponent(JSON.stringify(stateData))}&scope=profile%20openid`, "LineLogin", "width=500,height=600");
        }

        function applySettings() { document.getElementById('brand-title').innerText = settings.brand; }
        function handleAdminToggle() { isAdminLoggedIn ? switchToBuyerView() : document.getElementById('admin-view').classList.remove('hidden'); }
        function switchToBuyerView() { document.getElementById('admin-view').classList.add('hidden'); }
        function switchAdminTab(tab) { ['products', 'orders', 'settings'].forEach(t => document.getElementById(`admin-tab-${t}`).classList.add('hidden')); document.getElementById(`admin-tab-${tab}`).classList.remove('hidden'); }
        function saveProduct(e) {
            e.preventDefault();
            products.unshift({ id: "p_" + Date.now(), name: document.getElementById('p-name').value, country: document.getElementById('p-country').value, price: Number(document.getElementById('p-price').value), stock: Number(document.getElementById('p-stock').value), deadline: document.getElementById('p-deadline').value, desc: document.getElementById('p-desc').value, images: [...currentUploadedImages] });
            localStorage.setItem('daigou_products', JSON.stringify(products));
            syncProductsToCloud();
            alert('上架成功！');
            renderBuyerProducts();
        }
        function saveBasicSettings() {
            settings.sheetsUrl = document.getElementById('setting-sheets-url').value;
            settings.brand = document.getElementById('setting-brand').value;
            localStorage.setItem('daigou_settings', JSON.stringify(settings));
            alert('設定已儲存');
        }
        function closeOrderSuccessModal() { document.getElementById('order-success-modal').classList.add('hidden'); }
        function openBuyerOrdersModal() {}
        function openCartModal() {}
    </script>
</body>
</html>
